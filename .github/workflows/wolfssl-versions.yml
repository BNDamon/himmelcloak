name: wolfSSL and curl compatibility

# Keep the fixed baseline reproducible while detecting upstream drift in
# wolfSSL and curl without manually updating version strings.
on:
  push:
    branches: ['main', 'core', 'release/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: native-versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-wolfssl.yml

  test:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          build-args: |
            WOLFSSL_REF=${{ matrix.wolfssl-ref }}
            WOLFSSL_COMMIT=${{ matrix.wolfssl-commit }}
            CURL_REF=${{ matrix.curl-ref }}
            CURL_COMMIT=${{ matrix.curl-commit }}
      - name: Show resolved versions
        run: |
          docker run --rm himmelcloak-tester:ci cat /opt/himmelcloak-native/.himmelcloak-refs
          docker run --rm himmelcloak-tester:ci sh -c 'grep LIBWOLFSSL_VERSION_STRING /opt/himmelcloak-native/include/wolfssl/version.h; /opt/himmelcloak-native/bin/curl-config --version; /opt/himmelcloak-native/bin/curl-config --ssl-backends'
      - name: Build all features and run unit and contract tests
        run: |
          docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci cargo build --locked --workspace --all-features
          docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci cargo test --locked --workspace --tests
