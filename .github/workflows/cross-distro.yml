name: Cross-distro build and tests
on:
  push:
    branches: ['main', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-distro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.distro }} / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/aidangarske/himmelcloak-ci@${{ matrix.digest }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian-12
          - ubuntu-24.04
          - opensuse-leap-16.0
          - opensuse-tumbleweed
          - sle-bci-16.0
          - rockylinux-9
          - fedora
        features: [default, none, password, gov, passwordless, webauthn-virtual]
        # Pinned to the digests publish-ci-image.yml lists in its run summary; bump them together.
        include:
          - { distro: debian-12, digest: "sha256:77fae38660bd0f383fdc1c2a2860669796d85dfb10f826e195234dde6ead1e8b" }
          - { distro: ubuntu-24.04, digest: "sha256:23e1c3e3d67e86d414f4d5469498fb02660c2cbaf8ba07bb0430ad747b859916" }
          - { distro: opensuse-leap-16.0, digest: "sha256:27882bc953b3a9e10490422b937c3761ba86c16752ba9a9cb03b6223b5459319" }
          - { distro: opensuse-tumbleweed, digest: "sha256:501b7708d3801b8a30b1b699d1b09f7acde73efae21fd48b9cb7a063a465a7c1" }
          - { distro: sle-bci-16.0, digest: "sha256:64b315c7d893ff3201cb728804c69d1eb6f71a30b6467ae0ec7f5cb129a30231" }
          - { distro: rockylinux-9, digest: "sha256:8898895f05db551f5447db327b48a00ae0ea353001fa69f1fc0f58a3b41e739f" }
          - { distro: fedora, digest: "sha256:9ee62ec3d97d0c42171de6b540c52a14a71e9414e2c08dfe74946b00f6a5d249" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          case "$FEATURES" in
            default) flags=() ;;
            none) flags=(--no-default-features) ;;
            *) flags=(--no-default-features --features "$FEATURES") ;;
          esac
          cargo build --locked "${flags[@]}"
          cargo test --locked --tests "${flags[@]}"
