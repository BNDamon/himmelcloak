name: Resolve native dependency refs

# Resolve moving upstream refs at run time. The normal build stays on the releases
# pinned in scripts/build-native.sh; this matrix catches compatibility drift.
on:
  workflow_call:
    outputs:
      matrix:
        description: 'JSON matrix of moving wolfSSL and curl refs'
        value: ${{ jobs.resolve.outputs.matrix }}
      latest-stable:
        description: 'Latest wolfSSL v*-stable tag resolved at run time'
        value: ${{ jobs.resolve.outputs.latest-stable }}
      curl-latest-stable:
        description: 'Latest curl release tag resolved at run time'
        value: ${{ jobs.resolve.outputs.curl-latest-stable }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve wolfSSL and curl refs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      latest-stable: ${{ steps.set.outputs.latest-stable }}
      curl-latest-stable: ${{ steps.set.outputs.curl-latest-stable }}
    steps:
      - name: Resolve latest stable tags and development branches
        id: set
        run: |
          set -euo pipefail
          WOLFSSL_LATEST=$(git ls-remote --tags --refs https://github.com/wolfSSL/wolfssl.git 'v*-stable' \
                     | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-stable$' \
                     | sort -V | tail -n 1)
          CURL_LATEST=$(git ls-remote --tags --refs https://github.com/curl/curl.git 'curl-*' \
                     | awk -F/ '{print $NF}' | grep -E '^curl-[0-9]+_[0-9]+_[0-9]+$' \
                     | sort -V | tail -n 1)
          if [ -z "${WOLFSSL_LATEST:-}" ] || [ -z "${CURL_LATEST:-}" ]; then
            echo "::error::Could not resolve latest wolfSSL or curl release tag from remote"
            exit 1
          fi
          resolve_tag_commit() {
            local remote=$1 tag=$2 matches commit
            matches=$(git ls-remote --exit-code --tags "$remote" "refs/tags/$tag^{}" "refs/tags/$tag")
            commit=$(awk -v tag="$tag" '$2 == "refs/tags/" tag "^{}" { print $1; exit }' <<< "$matches")
            if [ -z "$commit" ]; then
              commit=$(awk -v tag="$tag" '$2 == "refs/tags/" tag { print $1; exit }' <<< "$matches")
            fi
            printf '%s\n' "$commit"
          }
          WOLFSSL_LATEST_COMMIT=$(resolve_tag_commit https://github.com/wolfSSL/wolfssl.git "$WOLFSSL_LATEST")
          CURL_LATEST_COMMIT=$(resolve_tag_commit https://github.com/curl/curl.git "$CURL_LATEST")
          WOLFSSL_MASTER_COMMIT=$(git ls-remote --exit-code --heads https://github.com/wolfSSL/wolfssl.git master | awk '{print $1}')
          CURL_MASTER_COMMIT=$(git ls-remote --exit-code --heads https://github.com/curl/curl.git master | awk '{print $1}')
          for commit in "$WOLFSSL_LATEST_COMMIT" "$CURL_LATEST_COMMIT" "$WOLFSSL_MASTER_COMMIT" "$CURL_MASTER_COMMIT"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid native dependency commit: $commit"; exit 1; }
          done
          echo "Latest stable wolfSSL: $WOLFSSL_LATEST at $WOLFSSL_LATEST_COMMIT"
          echo "Latest stable curl: $CURL_LATEST at $CURL_LATEST_COMMIT"
          echo "wolfSSL master: $WOLFSSL_MASTER_COMMIT"
          echo "curl master: $CURL_MASTER_COMMIT"
          echo "latest-stable=$WOLFSSL_LATEST" >> "$GITHUB_OUTPUT"
          echo "curl-latest-stable=$CURL_LATEST" >> "$GITHUB_OUTPUT"
          MATRIX=$(jq -nc --arg wolfssl "$WOLFSSL_LATEST" --arg curl "$CURL_LATEST" \
            --arg wolfssl_commit "$WOLFSSL_LATEST_COMMIT" --arg curl_commit "$CURL_LATEST_COMMIT" \
            --arg wolfssl_master "$WOLFSSL_MASTER_COMMIT" --arg curl_master "$CURL_MASTER_COMMIT" '{
            include: [
              {"name":"latest stable wolfSSL and curl","wolfssl-ref":$wolfssl,"wolfssl-commit":$wolfssl_commit,"curl-ref":$curl,"curl-commit":$curl_commit},
              {"name":"wolfSSL master with stable curl","wolfssl-ref":"master","wolfssl-commit":$wolfssl_master,"curl-ref":$curl,"curl-commit":$curl_commit},
              {"name":"curl master with stable wolfSSL","wolfssl-ref":$wolfssl,"wolfssl-commit":$wolfssl_commit,"curl-ref":"master","curl-commit":$curl_master}
            ]
          }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
