name: Resolve Keycloak images

# The stable release comes from Keycloak's numeric release tags. Its official
# nightly image is the development build. Each login job resolves its own digest
# so nightly registry failures cannot prevent the stable job from starting.
on:
  workflow_call:
    outputs:
      matrix:
        description: 'Stable and nightly Keycloak image references'
        value: ${{ jobs.resolve.outputs.matrix }}
      latest-stable:
        description: 'Latest stable Keycloak source tag'
        value: ${{ jobs.resolve.outputs.latest-stable }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      latest-stable: ${{ steps.set.outputs.latest-stable }}
    steps:
      - name: Resolve stable tag, development ref, and image digests
        id: set
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/keycloak/keycloak.git '[0-9]*' \
            | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ -z "${TAG:-}" ]; then
            echo '::error::Could not resolve a stable Keycloak release tag'
            exit 1
          fi
          echo "latest-stable=$TAG" >> "$GITHUB_OUTPUT"
          MATRIX=$(jq -nc --arg tag "$TAG" '{
              include: [
                {"name":"Keycloak stable login","keycloak-ref":$tag,"keycloak-image":("quay.io/keycloak/keycloak:" + $tag),"experimental":false},
                {"name":"Keycloak nightly login","keycloak-ref":"nightly","keycloak-image":"quay.io/keycloak/keycloak:nightly","experimental":true}
              ]
            }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
