name: Core build and unit tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust format, Clippy, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          cache-from: type=gha,scope=himmelcloak-native
          cache-to: type=gha,mode=max,scope=himmelcloak-native
      - name: Format
        run: docker run --rm -v "$PWD:/work" -w /work himmelcloak-tester:ci cargo fmt --all --check
      - name: Clippy
        run: docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: |
          for features in default none password gov passwordless; do
            case "$features" in
              default) flags=() ;;
              none) flags=(--no-default-features) ;;
              *) flags=(--no-default-features --features "$features") ;;
            esac
            docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target \
              -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci \
              cargo test --locked -p himmelcloak --tests "${flags[@]}"
          done
          docker run --rm -v "$PWD:/work" -v himmelcloak-cargo-target:/tmp/himmelcloak-target \
            -e CARGO_TARGET_DIR=/tmp/himmelcloak-target -w /work himmelcloak-tester:ci \
            cargo test --locked --workspace --lib
