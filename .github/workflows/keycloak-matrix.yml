name: Keycloak login tests
on:
  push:
    branches: ['main', 'release/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    uses: ./.github/workflows/_resolve-keycloak.yml

  login:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    env:
      KEYCLOAK_IMAGE: ${{ matrix.keycloak-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve server image digest
        run: |
          docker pull "$KEYCLOAK_IMAGE"
          digest=$(docker image inspect "$KEYCLOAK_IMAGE" --format '{{index .RepoDigests 0}}')
          test -n "$digest"
          echo "KEYCLOAK_IMAGE=$digest" >> "$GITHUB_ENV"
          echo "Keycloak image: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Record nightly source reference
        if: matrix.experimental
        run: |
          git ls-remote --heads https://github.com/keycloak/keycloak.git main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tests/build/Dockerfile
          load: true
          tags: himmelcloak-tester:ci
          cache-from: type=gha,scope=himmelcloak-native
          cache-to: type=gha,mode=max,scope=himmelcloak-native
      - name: Generate test certificate
        run: tests/keycloak/bootstrap-cert.sh
      - name: Start stock Keycloak
        run: docker compose -f tests/keycloak/docker-compose.yml up -d keycloak
      - name: Record server image
        run: |
          echo "Keycloak image channel: ${{ matrix.keycloak-ref }}"
          docker image inspect "$KEYCLOAK_IMAGE" --format '{{index .RepoDigests 0}}'
      - name: Run live login suite
        run: |
          docker compose -f tests/keycloak/docker-compose.yml run --rm \
            -e HIMMELCLOAK_TEST_VERBOSE=1 tester \
            cargo test --locked --test live_keycloak -- --ignored --nocapture
      - name: Show Keycloak authentication events
        if: always()
        run: |
          docker compose -f tests/keycloak/docker-compose.yml logs --no-color keycloak \
            | awk -f tests/keycloak/auth-events.awk
      - name: Keycloak logs on failure
        if: failure()
        run: docker compose -f tests/keycloak/docker-compose.yml logs --no-color keycloak
      - name: Stop Keycloak
        if: always()
        run: docker compose -f tests/keycloak/docker-compose.yml down -v
      - name: Report nightly failure
        if: ${{ failure() && matrix.experimental }}
        run: |
          echo '::warning::Keycloak nightly failed; inspect this job and its server logs. Stable login remains required.'
          echo '### Keycloak nightly failed (non-blocking)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the failed steps and Keycloak logs in this job.' >> "$GITHUB_STEP_SUMMARY"
