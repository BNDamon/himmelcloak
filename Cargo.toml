# Himmelcloak native Keycloak authentication for Linux.
# See docs/README.md.
[workspace]
members = ["crates/pam_himmelcloak", "crates/nss_himmelcloak"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95.0"
license = "GPL-3.0-or-later"
authors = [
  "Damon Bun",
  "Joshua Conklin",
  "Kevin Torrecampo",
  "Aidan Garske",
  "Harrison Barrett",
  "Harman Samra",
]
repository = "https://github.com/aidangarske/himmelcloak"

# Enforced by `cargo clippy` in CI (not by `cargo build`).
[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[package]
name = "himmelcloak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Keycloak authentication for Linux applications."

[lints]
workspace = true

[features]
# Reserve the planned additive feature names. The OIDC core, wolfCrypt, and
# wolfSSL-backed transport are built in every profile. The password grant
# requires `password`; `totp` controls its optional OTP field. Bundles are
# additive; use --no-default-features for a gov or passwordless profile.
default = ["password", "totp"]

# --- planned auth methods ---
password = []
totp = []
sms = []
email = []
recovery = []
webauthn = []
x509 = []
required-actions = []
device-flow = []

# --- webauthn transports / authenticator kinds (sub-features of webauthn) ---
webauthn-usb = ["webauthn"]
webauthn-platform = ["webauthn"]
webauthn-nfc = ["webauthn"]
webauthn-ble = ["webauthn"]
webauthn-virtual = ["webauthn"]

# --- reserved names for future optional crypto and TLS backends ---
crypto-wolfcrypt = []
tls-wolfssl = []

# --- hardware key custody (off by default) ---
hsm-seal = []
hw-wolftpm = []
hw-wolfhsm = []
tpm-simulator = []

# --- optional COSE ---
cose-wolfcose = []

# --- convenience bundles ---
full = ["password","totp","sms","email","recovery","webauthn","webauthn-usb","webauthn-platform","webauthn-nfc","webauthn-ble","x509","required-actions","device-flow","hsm-seal","hw-wolftpm","hw-wolfhsm","cose-wolfcose"]
gov = ["x509","webauthn","webauthn-usb","webauthn-platform","totp","recovery","hsm-seal","hw-wolftpm"]
passwordless = ["webauthn","webauthn-usb","x509","recovery"]

[dependencies]
base64 = "0.23"
curl = { version = "=0.4.50", default-features = false }
curl-sys = { version = "=0.4.90", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signature = "2.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
url = "2"
wolfssl-wolfcrypt = { version = "=2.2.0", features = ["signature"] }
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
