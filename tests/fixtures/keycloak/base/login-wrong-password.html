<!DOCTYPE html>
<html class="" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>Sign in to himmelcloak-test</title>
        <link rel="icon" href="/resources/FIXTURE/login/base/img/favicon.ico" />
    <script type="importmap">
        {
            "imports": {
                "rfc4648": "/resources/FIXTURE/common/keycloak/vendor/rfc4648/rfc4648.js"
            }
        }
    </script>
    <script src="/resources/FIXTURE/login/base/js/menu-button-links.js" type="module"></script>
    <script type="module">
        import { startSessionPolling } from "/resources/FIXTURE/login/base/js/authChecker.js";

        startSessionPolling(
            "/realms/himmelcloak-test/login-actions/restart?client_id=himmelcloak-test-client&tab_id=FIXTURE&client_data=FIXTURE&skip_logout=true"
        );
    </script>
    <script type="module">
        document.addEventListener("click", (event) => {
            const link = event.target.closest("a[data-once-link]");

            if (!link) {
                return;
            }

            if (link.getAttribute("aria-disabled") === "true") {
                event.preventDefault();
                return;
            }

            const { disabledClass } = link.dataset;

            if (disabledClass) {
                link.classList.add(...disabledClass.trim().split(/\s+/));
            }

            link.setAttribute("role", "link");
            link.setAttribute("aria-disabled", "true");
        });
    </script>
        <script type="module">
            import { checkAuthSession } from "/resources/FIXTURE/login/base/js/authChecker.js";

            checkAuthSession(
                "FIXTURE"
            );
        </script>
<SCRIPT> if (typeof history.replaceState === 'function') {  history.replaceState({}, "some title", "https://keycloak.test:8443/realms/himmelcloak-test/login-actions/authenticate?execution=FIXTURE&client_id=himmelcloak-test-client&tab_id=FIXTURE&client_data=FIXTURE"); }</SCRIPT></head>

<body class="" data-page-id="login-login">
<div class="">
    <div id="kc-header" class="">
        <div id="kc-header-wrapper"
             class="">himmelcloak-test</div>
    </div>
    <div class="">
        <header class="">
                <h1 id="kc-page-title">        Sign in to your account

</h1>
      </header>
      <div id="kc-content">
        <div id="kc-content-wrapper">


        <div id="kc-form">
          <div id="kc-form-wrapper">
                <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="https://keycloak.test:8443/realms/himmelcloak-test/login-actions/authenticate?session_code=FIXTURE&amp;execution=FIXTURE&amp;client_id=himmelcloak-test-client&amp;tab_id=FIXTURE&amp;client_data=FIXTURE" method="post">
                        <div class="">
                            <label for="username" class="">Username or email</label>

                            <input tabindex="2" id="username" class="" name="username" value="alice"  type="text"
                                   autofocus autocomplete="username"
                                   aria-invalid="true"
                                   dir="ltr"
                            />

                                <span id="input-error" class="" aria-live="polite">
                                        Invalid username or password.
                                </span>

                        </div>

                    <div class="">
                        <label for="password" class="">Password</label>

                        <div class="" dir="ltr">
                            <input tabindex="3" id="password" class="" name="password" type="password" autocomplete="current-password"
                                   aria-invalid="true"
                            />
                            <button class="" type="button" aria-label="Show password"
                                    aria-controls="password" data-password-toggle tabindex="4"
                                    data-icon-show="" data-icon-hide=""
                                    data-label-show="Show password" data-label-hide="Hide password">
                                <i class="" aria-hidden="true"></i>
                            </button>
                        </div>


                    </div>

                    <div class=" ">
                        <div id="kc-form-options">
                            </div>
                            <div class="">
                            </div>

                      </div>

                      <div id="kc-form-buttons" class="">
                          <input type="hidden" id="id-hidden-input" name="credentialId" />
                          <input tabindex="7" class="   " name="login" id="kc-login" type="submit" value="Sign In"/>
                      </div>
                </form>
            </div>
        </div>
        <script type="module" src="/resources/FIXTURE/login/base/js/passwordVisibility.js"></script>






        </div>
      </div>

    </div>
  </div>
</body>
</html>
