# cargo-deny config. License allow-list plus advisory checks.
[licenses]
include-dev = true
allow = [
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
]

# The published 2.2.0 manifest uses the deprecated GPL-3.0 identifier.
# Its src/lib.rs header grants GPL version 3 or later. Match this existing
# dependency's exact metadata without allowing GPL-3.0 for other crates.
[[licenses.exceptions]]
name = "wolfssl-wolfcrypt"
version = "=2.2.0"
allow = ["GPL-3.0"]

[advisories]
# Vulnerabilities are errors by default. No advisory IDs are ignored.
yanked = "deny"
